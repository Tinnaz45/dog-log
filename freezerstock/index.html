<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FreezerStock" />
  <meta name="theme-color" content="#0d1f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>FreezerStock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1f1a;
      --bg2: #132b24;
      --bg3: #1a3830;
      --accent: #4eca8b;
      --accent2: #2d9e65;
      --accent-dim: #1a5c3a;
      --text: #e8f5ef;
      --text2: #9dbfb0;
      --text3: #5a8a78;
      --border: rgba(78,202,139,0.15);
      --border2: rgba(78,202,139,0.3);
      --cam: #4eca8b;
      --brk: #7eb8ff;
      --brk-dim: #1a3a5c;
      --danger: #ff6b6b;
      --r: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

    .app { height: 100dvh; display: flex; flex-direction: column; }
    
    /* Header */
    .header { padding: calc(var(--safe-top) + 16px) 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .header-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--text); letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 1px; }
    .header-icon { width: 36px; height: 36px; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 10px; display: flex; align-items: center; justify-content: center; }

    /* Scroll container */
    .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-bot) + 80px); }
    .scroll::-webkit-scrollbar { display: none; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 20px calc(var(--safe-bot) + 10px); background: var(--bg); border-top: 0.5px solid var(--border); display: flex; gap: 8px; z-index: 100; }
    .nav-btn { flex: 1; padding: 11px 8px; border: 0.5px solid var(--border); border-radius: 12px; background: var(--bg2); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .nav-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }
    .nav-btn:active { transform: scale(0.97); }
    .nav-btn.active { background: var(--bg3); color: var(--text); border-color: var(--border2); }

    /* ── DASHBOARD ── */
    .dash-section { padding: 20px 20px 0; }
    .dash-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text3); margin-bottom: 12px; }
    .location-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 10px; }
    .location-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .loc-name { font-family: 'DM Serif Display', serif; font-size: 18px; }
    .loc-name.cam { color: var(--cam); }
    .loc-name.brk { color: var(--brk); }
    .loc-time { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .item-chip { background: var(--bg3); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
    .item-chip-name { font-size: 11px; color: var(--text3); line-height: 1.3; }
    .item-chip-val { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--text); }
    .no-data-msg { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

    /* ── STOCKTAKE ── */
    .stocktake-wrap { padding: 20px; }
    .loc-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .loc-tab { flex: 1; padding: 10px; border-radius: 12px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .loc-tab.active-cam { background: rgba(78,202,139,0.15); border-color: var(--cam); color: var(--cam); }
    .loc-tab.active-brk { background: rgba(126,184,255,0.12); border-color: var(--brk); color: var(--brk); }
    .loc-tab:active { transform: scale(0.97); }
    .entry-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text3); margin-bottom: 10px; }
    .entry-row { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .entry-name { flex: 1; font-size: 14px; color: var(--text); line-height: 1.3; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn { width: 34px; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; transition: background 0.1s; user-select: none; }
    .qty-btn:active { background: var(--accent-dim); color: var(--accent); }
    .qty-input { width: 52px; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); font-size: 16px; font-weight: 500; text-align: center; font-family: 'DM Mono', monospace; }
    .qty-input:focus { outline: none; border-color: var(--accent); }
    .save-wrap { padding: 16px 0 4px; }
    .save-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--accent); color: var(--bg); font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; }
    .save-btn:active { opacity: 0.85; }
    .toast { text-align: center; font-size: 13px; color: var(--accent); margin-top: 10px; height: 18px; opacity: 0; transition: opacity 0.3s; }

    /* ── HISTORY ── */
    .history-wrap { padding: 20px; }
    .history-entry { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
    .hist-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .hist-loc { font-family: 'DM Serif Display', serif; font-size: 16px; }
    .hist-loc.cam { color: var(--cam); }
    .hist-loc.brk { color: var(--brk); }
    .hist-dt { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; line-height: 1.5; }
    .hist-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 0 0 8px; transition: color 0.15s; }
    .hist-del:hover { color: var(--danger); }
    .hist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .hist-item { font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 0.5px solid var(--border); }
    .hist-item:last-child { border-bottom: none; }
    .hist-item strong { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--text); }
    .empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; line-height: 1.8; }
    .empty em { display: block; font-family: 'DM Serif Display', serif; font-style: italic; font-size: 18px; color: var(--text2); margin-bottom: 6px; }

    /* View transitions */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">FreezerStock</div>
      <div class="header-sub">Dog food inventory</div>
    </div>
    <div class="header-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4eca8b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="12" y1="9" x2="12" y2="21"/>
      </svg>
    </div>
  </div>

  <div class="scroll">
    <!-- DASHBOARD -->
    <div class="view active" id="view-dash">
      <div class="dash-section" style="padding-top:20px;">
        <div class="dash-label">Current stock</div>
        <div class="location-card" id="card-cam"></div>
        <div class="location-card" id="card-brk"></div>
      </div>
    </div>

    <!-- STOCKTAKE -->
    <div class="view" id="view-entry">
      <div class="stocktake-wrap">
        <div class="loc-tabs">
          <button class="loc-tab active-cam" id="lt-cam" onclick="switchLoc('Camperdown')">Camperdown</button>
          <button class="loc-tab" id="lt-brk" onclick="switchLoc('Breakwater')">Breakwater</button>
        </div>
        <div class="entry-label" id="entry-loc-label">Camperdown freezer</div>
        <div id="entry-list"></div>
        <div class="save-wrap">
          <button class="save-btn" onclick="saveSnapshot()">Save snapshot</button>
          <div class="toast" id="toast"></div>
        </div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="view" id="view-history">
      <div class="history-wrap" id="history-list"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-dash" onclick="showView('dash')">Overview</button>
    <button class="nav-btn primary" id="nav-entry" onclick="showView('entry')">+ New Stocktake</button>
    <button class="nav-btn" id="nav-history" onclick="showView('history')">History</button>
  </div>
</div>

<script>
const ITEMS = [
  "Dog meal containers",
  "Lyka packs",
  "Scratch packs",
  "Kilos of pet mince",
  "Packs of chicken necks"
];

let currentLoc = 'Camperdown';
let quantities = { Camperdown: {}, Breakwater: {} };
let history = [];

ITEMS.forEach(i => { quantities.Camperdown[i] = 0; quantities.Breakwater[i] = 0; });

function load() {
  try {
    const h = localStorage.getItem('fs_history'); if (h) history = JSON.parse(h);
    const q = localStorage.getItem('fs_qty'); if (q) quantities = JSON.parse(q);
  } catch(e) {}
}

function save() {
  try {
    localStorage.setItem('fs_history', JSON.stringify(history));
    localStorage.setItem('fs_qty', JSON.stringify(quantities));
  } catch(e) {}
}

function getLatest(loc) {
  return history.find(h => h.location === loc) || null;
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  ['dash','entry','history'].forEach(n => {
    const btn = document.getElementById('nav-' + n);
    btn.className = 'nav-btn' + (n === 'entry' ? ' primary' : '') + (n === v ? ' active' : '');
  });
  if (v === 'dash') renderDash();
  if (v === 'entry') renderEntry();
  if (v === 'history') renderHistory();
}

function renderDash() {
  ['Camperdown','Breakwater'].forEach(loc => {
    const cls = loc === 'Camperdown' ? 'cam' : 'brk';
    const latest = getLatest(loc);
    const card = document.getElementById('card-' + cls);
    if (!latest) {
      card.innerHTML = `
        <div class="location-card-header">
          <div class="loc-name ${cls}">${loc}</div>
          <div class="loc-time">No data yet</div>
        </div>
        <div class="no-data-msg">No stocktake recorded yet.</div>`;
      return;
    }
    card.innerHTML = `
      <div class="location-card-header">
        <div class="loc-name ${cls}">${loc}</div>
        <div class="loc-time">${latest.date}<br>${latest.time}</div>
      </div>
      <div class="item-grid">
        ${ITEMS.map(i => `
          <div class="item-chip">
            <div class="item-chip-name">${i}</div>
            <div class="item-chip-val">${latest.items[i] ?? 0}</div>
          </div>`).join('')}
      </div>`;
  });
}

function switchLoc(loc) {
  currentLoc = loc;
  document.getElementById('lt-cam').className = 'loc-tab' + (loc === 'Camperdown' ? ' active-cam' : '');
  document.getElementById('lt-brk').className = 'loc-tab' + (loc === 'Breakwater' ? ' active-brk' : '');
  document.getElementById('entry-loc-label').textContent = loc + ' freezer';
  renderEntry();
}

function renderEntry() {
  const list = document.getElementById('entry-list');
  list.innerHTML = '';
  ITEMS.forEach(item => {
    const val = quantities[currentLoc][item] || 0;
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <div class="entry-name">${item}</div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="adj('${item}',-1)">−</button>
        <input class="qty-input" type="number" min="0" inputmode="numeric" value="${val}" oninput="setV('${item}',this.value)" />
        <button class="qty-btn" onclick="adj('${item}',1)">+</button>
      </div>`;
    list.appendChild(row);
  });
}

function adj(item, d) {
  quantities[currentLoc][item] = Math.max(0, (quantities[currentLoc][item] || 0) + d);
  save(); renderEntry();
}

function setV(item, v) {
  const n = parseInt(v); quantities[currentLoc][item] = isNaN(n) ? 0 : Math.max(0, n); save();
}

function saveSnapshot() {
  const now = new Date();
  history.unshift({
    id: now.getTime(), location: currentLoc,
    date: now.toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'numeric'}),
    time: now.toLocaleTimeString('en-AU', {hour:'2-digit',minute:'2-digit'}),
    items: { ...quantities[currentLoc] }
  });
  save();
  const t = document.getElementById('toast');
  t.textContent = 'Snapshot saved for ' + currentLoc;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

function delSnap(id) {
  history = history.filter(h => h.id !== id);
  save(); renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<div class="empty"><em>Nothing yet</em>Save a stocktake to start tracking changes over time.</div>';
    return;
  }
  list.innerHTML = history.map(h => {
    const cls = h.location === 'Camperdown' ? 'cam' : 'brk';
    return `<div class="history-entry">
      <div class="hist-head">
        <div>
          <div class="hist-loc ${cls}">${h.location}</div>
          <div class="hist-dt">${h.date} · ${h.time}</div>
        </div>
        <button class="hist-del" onclick="delSnap(${h.id})">✕</button>
      </div>
      <div class="hist-grid">
        ${ITEMS.map(i => `<div class="hist-item">${i}<strong>${h.items[i] ?? 0}</strong></div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

load(); renderDash();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
</body>
</html>
